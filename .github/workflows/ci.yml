name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set the repo variable SITE_URL once the custom domain is live.
  VITE_SITE_URL: ${{ vars.SITE_URL || 'https://little-malik.pages.dev' }}

jobs:
  verify:
    name: Lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Format
        run: bun run format:check

      - name: Unit tests
        run: bun run test

      - name: Build (prerender)
        run: bun run build

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/client
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    # Requires repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Skip when Cloudflare secrets are missing
        if: env.HAS_CF_SECRETS != 'true'
        run: echo "::notice::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable deploys (see docs/DEPLOYMENT.md)."

      - uses: actions/checkout@v4
        if: env.HAS_CF_SECRETS == 'true'

      - uses: actions/download-artifact@v4
        if: env.HAS_CF_SECRETS == 'true'
        with:
          name: site
          path: dist/client

      - name: Deploy
        id: deploy
        if: env.HAS_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/client --project-name=little-malik --branch=${{ github.head_ref || github.ref_name }}
