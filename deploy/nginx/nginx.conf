# Little Malik — nginx config for self-hosting the static build (dist/client).
# Mirrors the Cloudflare Pages behaviour in public/_headers and public/_redirects.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    # Relative Location headers — correct behind proxies / mapped ports.
    absolute_redirect off;

    # ── Compression ────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript application/manifest+json image/svg+xml;

    # ── Security headers ───────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Enable once served over HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Friendly redirects (keep in sync with public/_redirects) ──
    location = /products  { return 301 /produk; }
    location = /catalog   { return 301 /produk; }
    location = /katalog   { return 301 /produk; }
    location = /about     { return 301 /tentang; }
    location = /contact   { return 301 /kontak; }
    location = /index.html { return 301 /; }
    location ~ ^/products/(.+)$ { return 301 /produk/$1; }

    # Canonical URLs have no trailing slash (except "/").
    rewrite ^/(.+)/$ /$1 permanent;

    # ── Caching ────────────────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~* ^/(images|icons)/ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ~ ^/llms(-full)?\.txt$ {
        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # ── Pages ──────────────────────────────────────────────────────
    # Prerendered pages live at /produk.html, /produk/<slug>.html, ...
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Don't serve the Cloudflare-only config files.
    location ~ ^/_(headers|redirects)$ { return 404; }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
